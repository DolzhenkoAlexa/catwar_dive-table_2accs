<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌊 Дайв-лут</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <h1>🌊 Дайв-лут 🌊</h1>

      <div class="header-right">
        <div class="files-row">
          <button onclick="exportFile()">💾 Скачать JSON</button>
          <label class="btn">
            📂 Загрузить JSON
            <input type="file" id="fileInput" accept=".json" hidden>
          </label>
        </div>

        <label class="location-picker">
          <span>Вид ныряния:</span>
          <select id="locationSelect" onchange="switchAddLocation(this.value)">
            <option value="sea">Морское</option>
            <option value="river">Речное</option>
          </select>
        </label>

        <nav class="accounts" id="accounts"></nav>
      </div>
    </header>

    <main class="layout">
      <div class="col col-left">
        <section class="card chart-card">
          <div class="chart-head">
            <h2>Соотношение лута</h2>
          </div>
          <div class="chart-toggles">
            <button id="togglePos" class="toggle active" onclick="togglePos()"></button>
            <button id="toggleSuper" class="toggle active" onclick="toggleSuper()"></button>
            <button id="toggleNeg" class="toggle active" onclick="toggleNeg()"></button>
            <button id="toggleLoc" class="toggle active" onclick="toggleLoc()"></button>
          </div>
          <div class="chart-wrap">
            <canvas id="pieChart"></canvas>
          </div>
        </section>

        <section class="card add-card">
          <h2>Добавить лут</h2>
          <div class="add-row">
            <!-- Кастомная кнопка даты -->
            <div class="date-picker-wrap">
              <button type="button" class="date-btn" onclick="openDatePicker(event)" title="Изменить дату">
                <span id="dateBtnLabel">Дата: сегодня</span>
              </button>
              <!-- Скрытый нативный input, на который кликаем программно -->
              <input type="date" id="addDate" class="hidden-date" onchange="onDateChange(this)">
              <!-- Кнопка сброса на сегодня (появляется только если выбрана другая дата) -->
              <button type="button" id="resetDateBtn" class="reset-date" onclick="resetAddDate(event)" title="Сбросить на сегодня">✕</button>
            </div>
            
            <select id="catalogSelect"></select>
            <button class="primary" onclick="addDrop()">+</button>
          </div>
        </section>
      </div>

      <div class="col col-right">
        <section class="card filter-card">
          <div class="filter-row">
            <input type="date" id="dateFrom" onchange="applyFilter()" title="С даты">
            <span class="filter-sep">–</span>
            <input type="date" id="dateTo" onchange="applyFilter()" title="По дату">
            <button class="filter-reset" onclick="resetFilter()" title="Сбросить фильтр">✕</button>
            <button class="notes-btn" onclick="openNotesModal()" title="Заметки">?</button>
          </div>
        </section>

        <section class="card stats-card">
          <h2>Статистика: <span id="currentName"></span><span id="periodLabel" class="period-label"></span></h2>
          <div id="stats"></div>
        </section>

        <section class="card drops-card">
          <h2>Записи <span class="count" id="dropCount"></span></h2>
          <div id="dropsList" class="drops-list"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Модалка заметок -->
  <div class="modal-overlay" id="notesOverlay" onclick="closeNotesModal(event)">
    <div class="modal">
      <div class="modal-head">
        <h3>Заметки</h3>
        <button class="modal-close" onclick="closeNotesModal()">✕</button>
      </div>
      <p class="modal-hint">
        Заметки для сохранения дат прокачки ЗУ, ПУ и иной другой информации, чтоб легче было пользоваться фильтром.
      </p>
      <div class="notes-list" id="notesList"></div>
      <div class="notes-add">
        <textarea id="noteInput" placeholder="Новая заметка..." rows="2"></textarea>
        <button class="primary" onclick="addNote()">Добавить</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=23"></script>
</body>
</html>
